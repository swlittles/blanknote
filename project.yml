name: BlankNote
options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BlankNoteCore:
    path: Packages/BlankNoteCore
targets:
  BlankNote:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: BlankNote
        excludes:
          - "*.entitlements"
          - Info.plist
    dependencies:
      - package: BlankNoteCore
    postBuildScripts:
      # Info.plist keys aren't expanded like values, so the iCloud Drive folder's entry is written
      # under a placeholder key and renamed here to the real container, iCloud.<bundle ID>.
      - name: Name the iCloud container in Info.plist
        basedOnDependencyAnalysis: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          placeholder=':NSUbiquitousContainers:iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)'
          if /usr/libexec/PlistBuddy -c "Print $placeholder" "$plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Copy $placeholder :NSUbiquitousContainers:iCloud.$PRODUCT_BUNDLE_IDENTIFIER" \
              -c "Delete $placeholder" "$plist"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).blanknote
        PRODUCT_NAME: BlankNote
        CODE_SIGN_STYLE: Automatic
        # Local Debug builds are ad-hoc signed, so they run without a provisioning profile, and
        # keep notes on the device. Release builds (TestFlight) add iCloud Drive, which needs a
        # profile with the iCloud container iCloud.<bundle ID>. The bundle ID prefix and team come
        # from Config/Signing.xcconfig.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": BlankNote/BlankNote-macOS.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # Merged into the generated Info.plist: shows the notes as a BlankNote folder in iCloud Drive.
        INFOPLIST_FILE: BlankNote/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: BlankNote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Several windows on iPad, as on the Mac.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Notes stored on the device show up in the Files app under On My iPhone › BlankNote.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": BlankNote/BlankNote-macOS-Release.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": BlankNote/BlankNote-iOS-Release.entitlements
  BlankNoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BlankNoteUITests
    dependencies:
      - target: BlankNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).blanknote.uitests
        TEST_TARGET_NAME: BlankNote
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  BlankNote:
    build:
      targets:
        BlankNote: all
    run:
      config: Debug
    test:
      targets:
        - BlankNoteUITests
    archive:
      config: Release
